name: 'RepoKit — Project Scaffolding'
description: 'Generate a complete project from 30+ templates in seconds'
inputs:
  template:
    description: 'Template to use (e.g., nextjs, fastapi, go-api)'
    required: false
    default: ''
  project-name:
    description: 'Project name'
    required: false
    default: 'my-project'
  database:
    description: 'Database choice (none, postgresql, mongodb, mysql, sqlite)'
    required: false
    default: 'none'
  include-docker:
    description: 'Include Docker configuration'
    required: false
    default: 'true'
  include-ci:
    description: 'Include CI/CD configuration'
    required: false
    default: 'true'
  license-key:
    description: 'StarsPay Pro license key (for Pro templates)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Install RepoKit
      shell: bash
      run: npm install -g repokit
    - name: Generate Project
      shell: bash
      env:
        STARSPAY_LICENSE_KEY: ${{ inputs.license-key }}
      run: |
        ARGS=""
        if [ -n "${{ inputs.template }}" ]; then
          ARGS="$ARGS --template ${{ inputs.template }}"
        fi
        ARGS="$ARGS --name ${{ inputs.project-name }}"
        ARGS="$ARGS --database ${{ inputs.database }}"
        if [ "${{ inputs.include-docker }}" = "true" ]; then
          ARGS="$ARGS --deploy Docker"
        fi
        if [ "${{ inputs.include-ci }}" = "true" ]; then
          ARGS="$ARGS --ci 'GitHub Actions'"
        fi
        ARGS="$ARGS --yes"
        repokit create $ARGS
branding:
  icon: 'rocket'
  color: 'blue'
