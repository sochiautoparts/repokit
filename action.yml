name: 'RepoKit — Project Scaffolding'
description: 'Generate a complete project from 30+ templates in seconds'
inputs:
  template:
    description: 'Template to use (e.g., nextjs, fastapi, go-api)'
    required: false
    default: ''
  project-name:
    description: 'Project name'
    required: false
    default: 'my-project'
  database:
    description: 'Database choice (none, postgresql, mongodb, mysql, sqlite)'
    required: false
    default: 'none'
  include-docker:
    description: 'Include Docker configuration'
    required: false
    default: 'true'
  include-ci:
    description: 'Include CI/CD configuration'
    required: false
    default: 'true'
  license-key:
    description: 'StarsPay Pro license key (for Pro templates)'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - name: Install RepoKit
      shell: bash
      # FIX: the "repokit" npm package is not published — install from the Action's own checkout
      run: npm install -g "${{ github.action_path }}"
    - name: Generate Project
      shell: bash
      env:
        STARSPAY_LICENSE_KEY: ${{ inputs.license-key }}
        # FIX: pass inputs via env to prevent shell injection
        INPUT_TEMPLATE: ${{ inputs.template }}
        INPUT_PROJECT_NAME: ${{ inputs.project-name }}
        INPUT_DATABASE: ${{ inputs.database }}
        INPUT_INCLUDE_DOCKER: ${{ inputs.include-docker }}
        INPUT_INCLUDE_CI: ${{ inputs.include-ci }}
      run: |
        # FIX: use a bash array to keep quoting intact (e.g. "GitHub Actions")
        ARGS=(--name "$INPUT_PROJECT_NAME" --database "$INPUT_DATABASE" --yes)
        if [ -n "$INPUT_TEMPLATE" ]; then
          ARGS+=(--template "$INPUT_TEMPLATE")
        fi
        if [ "$INPUT_INCLUDE_DOCKER" = "true" ]; then
          ARGS+=(--deploy Docker)
        fi
        if [ "$INPUT_INCLUDE_CI" = "true" ]; then
          ARGS+=(--ci "GitHub Actions")
        fi
        repokit create "${ARGS[@]}"
branding:
  icon: 'rocket'
  color: 'blue'
